<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}WM-FORECAST{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<div class="ticker-strip" id="ticker-strip">
  <div class="ticker-track" id="ticker-track">
    <span class="ticker-item">LOADING SIGNAL…</span>
  </div>
</div>

<header class="topbar">
  <a href="{{ url_for('home') }}" class="brand">
    <span class="brand-mark">WM</span><span class="brand-sep">/</span><span class="brand-name">FORECAST</span>
  </a>
  <nav class="mainnav">
    <a href="{{ url_for('home') }}" class="{{ 'active' if request.path == '/' else '' }}">01 · Overview</a>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.path == '/dashboard' else '' }}">02 · Dashboard</a>
    <a href="{{ url_for('stores_page') }}" class="{{ 'active' if request.path == '/stores' else '' }}">03 · Store Log</a>
    <a href="{{ url_for('forecast_page') }}" class="{{ 'active' if request.path == '/forecast' else '' }}">04 · Forecast</a>
    <a href="{{ url_for('stock_plan_page') }}" class="{{ 'active' if request.path == '/stock-plan' else '' }}">05 · Stock Plan</a>
    <a href="{{ url_for('about_page') }}" class="{{ 'active' if request.path == '/about' else '' }}">06 · Model</a>
  </nav>
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
</header>

<main class="page">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>WM-FORECAST · weekly sales forecasting console</span>
  <span>Model: <span id="footer-model">—</span></span>
</footer>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
